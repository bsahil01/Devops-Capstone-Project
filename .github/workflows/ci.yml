name: DevOps CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ⚙️ Automatic Build (Install Dependencies)
        run: npm ci

      - name: 🧪 Automatic Testing (Unit & Integration Tests)
        run: npm test

      - name: 📦 Automatic Packaging (Release Tarball)
        run: npm run package

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: employee-management-app:${{ github.sha }}

      - name: 🩺 Run Docker Smoke Test
        run: |
          docker run -d --name test-app -p 3000:3000 employee-management-app:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:3000/api/health
          docker stop test-app

      - name: 📤 Archive Packaging Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-package
          path: dist/*.tar.gz
